workflows:
  onyx-ios-simulator:
    name: ONYX iOS - simulateur
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Vérifier le projet Xcode
        script: |
          xcodebuild -list -project "$CM_BUILD_DIR/ONYXIOS.xcodeproj"
      - name: Compiler pour le simulateur iOS
        script: |
          set -o pipefail
          xcodebuild \
            -project "$CM_BUILD_DIR/ONYXIOS.xcodeproj" \
            -scheme ONYXIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/onyx-simulator-build.log
      - name: Créer le ZIP pour Appetize
        script: |
          cd "$CM_BUILD_DIR/build/Build/Products/Debug-iphonesimulator"
          /usr/bin/zip -r "$CM_BUILD_DIR/ONYXIOS-Simulator.zip" ONYXIOS.app
    artifacts:
      - ONYXIOS-Simulator.zip
      - /tmp/onyx-simulator-build.log
